name: SMTP Probe

on:
  workflow_dispatch:

jobs:
  authenticate:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      SENDER_PASS: ${{ secrets.SENDER_PASS }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Authenticate only (do not send)
        shell: python
        run: |
          import os
          import smtplib

          with smtplib.SMTP_SSL("smtp.qq.com", 465, timeout=15) as server:
              server.ehlo()
              print("SMTP handshake succeeded")
              server.login(os.environ["SENDER_EMAIL"], os.environ["SENDER_PASS"])
              print("SMTP authentication succeeded")
