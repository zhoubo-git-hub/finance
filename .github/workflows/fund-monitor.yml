name: Fund Monitor

# GitHub Actions workflow for the finance email job.

on:
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_TIMEZONE: Asia/Shanghai
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      SENDER_PASS: ${{ secrets.SENDER_PASS }}
      RECEIVER_GROUP_A: 542335825@qq.com
      RECEIVER_GROUP_B: 3217542796@qq.com
      FAILURE_NOTIFY_EMAIL: 3217542796@qq.com
      SMTP_SERVER: smtp.qq.com
      SMTP_PORT: "465"
      SMTP_FALLBACK_PORT: "587"
      SMTP_TIMEOUT: "15"
      SMTP_RETRY_COUNT: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test estimate fallbacks
        run: python -m unittest -v test_fund_monitor

      - name: Run fund monitor
        run: python fund_monitor.py

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fund-monitor-log
          path: fund_monitor.log
          if-no-files-found: ignore

      - name: Send failure notification
        if: failure()
        shell: python
        run: |
          import os
          from fund_monitor import send_email

          receiver = os.environ["FAILURE_NOTIFY_EMAIL"]
          run_id = os.environ["GITHUB_RUN_ID"]
          repo = os.environ["GITHUB_REPOSITORY"]
          job_url = f"https://github.com/{repo}/actions/runs/{run_id}"

          try:
              with open("fund_monitor.log", "r", encoding="utf-8-sig") as file:
                  log_tail = file.read()[-4000:]
          except FileNotFoundError:
              log_tail = "fund_monitor.log not found."

          body = (
              "GitHub Actions fund monitor failed.\n\n"
              f"Repository: {repo}\n"
              f"Run URL: {job_url}\n\n"
              "Recent log:\n"
              f"{log_tail}"
          )

          if not send_email(body, receiver, "GitHub Actions Failure"):
              raise SystemExit("Failure notification email could not be sent.")
